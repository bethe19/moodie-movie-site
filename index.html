      <section id="hero">
        <div class="over">
          <div class="hero-overlay">
            <div class="container hero-content">
              <div class="trending-badge" id="category-badge">> Now Playing</div>
              <div class="hero-textcontainer" id="hero-textcontainer"></div>
              

              <div class="hero-actions group">
                <div class="movieslide">
                  <a href="./moviedetail.html" class="btn-see-more">See More →</a>
                  <button class="btn-add">+</button>
                </div>
                <div class="mood-input-box">
                  <input
                    type="text"
                    id="mood-input"
                    placeholder="Type your mood . . . eg. I feel sad today"
                  />
                  <button id="mood-submit">🙂</button>
                </div>
              </div>

              <div class="hero-carousel-indicators">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Popular Movies -->
      <section id="popular-movies">
        <div class="container">
          <h2>Popular Movies</h2>
          <div class="carousel-controls">
            <button class="carousel-btn left" data-target="movie-grid">
              ←
            </button>
            <button class="carousel-btn right" data-target="movie-grid">
              →
            </button>
          </div>
          <div class="popular movie-grid carousel" id="movie-grid">
          </div>
        </div>
      </section>

      <!-- Popular Actors -->
      <section id="popular-actors">
        <div class="container">
          <h2>Popular Actors</h2>
          <div class="carousel-controls">
            <button class="carousel-btn left" data-target="actor-grid">
              ←
            </button>
            <button class="carousel-btn right" data-target="actor-grid">
              →
            </button>
          </div>
          <div
            class="popular-actors actor-grid carousel"
            id="actor-grid carousel"
            id="actor-grid"
          >
            <!-- Actor Card 1 -->

            <!-- More actor cards... -->
          </div>
        </div>
      </section>
